name: Locale

on:
  push:
    paths:
      - packages/i18n/**
      - locales/**
      - .github/workflows/locale.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/i18n/**
      - locales/**
      - .github/workflows/locale.yml
jobs:
  locale_verify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: ".node-version"
          cache: true
          install: false
      - run: pnpm i --frozen-lockfile
      - run: pnpm --filter i18n build
      - name: Verify Locales
        working-directory: ./packages/i18n
        run: pnpm run verify
